# iOS build of Xash3D FWGS with Half-Life, Opposing Force and Blue Shift game
# libraries in one unsigned IPA. Signing and TestFlight are done by
# Sithewok-apps/ios-pipeline (testflight-ipa.yml), which takes the IPA from the
# ios-latest release (master) or from a run artifact (any branch).
#
# What a run publishes:
#   - a push to master, or a manual run of master with "release" left empty:
#     the IPA to the "ios-latest" prerelease, as always (deleted and made
#     again). Pushes to ios/** branches only keep the IPA as a run artifact.
#   - a manual run of master with "release" set to a tag such as ios-v0.1
#     (gh workflow run ios-trilogy.yml --ref master -f release=ios-v0.1): a
#     release for that tag, created at the commit being built, with
#     Documentation/ios-release-notes.md from that commit as its text and the
#     IPA attached, marked as the latest release. A version with a '-' in it
#     (ios-v0.1-beta1) is a prerelease instead and isn't marked latest.
#     ios-latest is left alone. The run stops before building if it isn't on
#     master, the tag isn't ios-v<version>, the tag is already on another
#     commit, or the notes have no "### What's in <tag>" line.
#   Running it again for the same tag on the same commit updates that release.
#
# The app draws with OpenGL ES 3.0 on Metal through ANGLE
# (engine/platform/ios/ios_angle.c), falling back to Apple's OpenGL ES.
# ANGLE is built by the "angle" job with Chromium's tools (depot_tools, gn)
# and cached: the first run takes a long time, later runs restore it in
# seconds. To rebuild it, change ANGLE_REV or bump ANGLE_CACHE_VERSION.
name: iOS (HL + OF + BS)

on:
  push:
    branches: [ master, 'ios/**' ]
  workflow_dispatch:
    inputs:
      release:
        description: >-
          Publish this build as a release with this tag (for example ios-v0.1),
          created at the commit being built. Leave empty to update ios-latest as usual.
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  # Release runs for one tag go one at a time and are never cancelled (a
  # newer one waits). Every other run keeps the per-branch group, where a
  # newer push cancels the older run.
  group: ${{ inputs.release != '' && format('ios-release-{0}', inputs.release) || format('ios-{0}', github.ref) }}
  cancel-in-progress: ${{ inputs.release == '' }}

env:
  # ANGLE branch chromium/8060 (Sept 15 2026), from the github.com/google/angle
  # mirror: the revision the owner's Jedi Knight, Dark Forces and DOOM 3 ports ship.
  ANGLE_REV: 4b7308a36376199c095ccb0ab69b773daa8b9fbe
  ANGLE_CACHE_VERSION: v1
  # ANGLE's minimum iOS. The app still installs on older ones (12.0): the
  # engine opens ANGLE at run time, and when dyld refuses it there, the app
  # draws with Apple's OpenGL ES as before.
  ANGLE_IOS_TARGET: '18.0'

jobs:
  angle:
    runs-on: macos-15
    # the first (uncached) build is long
    timeout-minutes: 330
    outputs:
      key: ${{ steps.angle-cache.outputs.cache-primary-key }}
    steps:
    - name: Restore ANGLE from cache
      id: angle-cache
      uses: actions/cache/restore@v4
      with:
        path: angle-prebuilt
        key: angle-ios-arm64-${{ env.ANGLE_REV }}-ios${{ env.ANGLE_IOS_TARGET }}-${{ env.ANGLE_CACHE_VERSION }}
        lookup-only: true

    - name: Select newest Xcode
      if: steps.angle-cache.outputs.cache-hit != 'true'
      run: |
        set -e
        XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
        echo "Using $XCODE"
        sudo xcode-select -s "$XCODE/Contents/Developer"
        xcodebuild -version
        xcrun --sdk iphoneos --show-sdk-version

    - name: Free disk space for ANGLE
      if: steps.angle-cache.outputs.cache-hit != 'true'
      run: |
        sudo rm -rf ~/Library/Android /usr/local/share/dotnet ~/.dotnet /usr/local/lib/node_modules || true
        df -h /

    - name: Build ANGLE (cache miss only)
      if: steps.angle-cache.outputs.cache-hit != 'true'
      run: |
        set -ex
        git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
        export PATH="$RUNNER_TEMP/depot_tools:$PATH"

        mkdir -p "$RUNNER_TEMP/angle" && cd "$RUNNER_TEMP/angle"
        git init -q
        git fetch --depth 1 https://github.com/google/angle "$ANGLE_REV"
        git checkout -q FETCH_HEAD

        # an unmanaged solution rooted at this checkout, for iOS, without
        # the (large, unneeded) Dawn/WebGPU dependencies
        cat > .gclient <<'GCLIENT'
        solutions = [
          {
            "name": ".",
            "url": "https://chromium.googlesource.com/angle/angle.git",
            "deps_file": "DEPS",
            "managed": False,
            "custom_deps": {},
            "custom_vars": {
              "checkout_angle_dawn_deps": False,
            },
          },
        ]
        target_os = ["ios"]
        GCLIENT

        gclient sync --no-history --shallow -j8
        df -h /

        gn gen out/ios --args="
          is_debug=false
          is_component_build=false
          symbol_level=0
          target_os=\"ios\"
          target_cpu=\"arm64\"
          target_environment=\"device\"
          ios_deployment_target=\"$ANGLE_IOS_TARGET\"
          ios_enable_code_signing=false
          angle_enable_vulkan=false
          angle_enable_swiftshader=false
          angle_enable_wgpu=false
          angle_build_tests=false
        "
        autoninja -C out/ios libEGL libGLESv2

        # only the two frameworks (the engine has no build-time use for ANGLE)
        DEST="$GITHUB_WORKSPACE/angle-prebuilt"
        mkdir -p "$DEST/out/ios"
        cp -R out/ios/libEGL.framework out/ios/libGLESv2.framework "$DEST/out/ios/"
        ls -la "$DEST/out/ios"

    # saved at once, so a failure later doesn't lose the slow build
    - name: Save ANGLE to cache
      if: steps.angle-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: angle-prebuilt
        key: ${{ steps.angle-cache.outputs.cache-primary-key }}

  ipa:
    needs: angle
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SDL_VERSION: 2.32.10
      HLSDK_REPO: https://github.com/FWGS/hlsdk-portable
      IPA_NAME: Xash3D-iOS-unsigned.ipa
      # The tag a manual run was asked to release; empty for pushes and ordinary runs.
      RELEASE_TAG: ${{ inputs.release }}
      # Release title; the tag's version is added after it (ios-v0.1 -> "... v0.1").
      RELEASE_TITLE: "Xash3D FWGS for iOS"
      RELEASE_NOTES: Documentation/ios-release-notes.md
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # Before the build: a release needs master, a usable tag and notes written for it.
    - name: Check release tag and notes
      if: env.RELEASE_TAG != ''
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -e
        if [ "$GITHUB_REF" != "refs/heads/master" ]; then
          echo "::error::Releases are made from master only (this run is on $GITHUB_REF)."
          exit 1
        fi
        case "$RELEASE_TAG" in
          ios-v*) ;;
          *) echo "::error::Release tag \"$RELEASE_TAG\" should look like ios-v0.1 (ios-v<version>)."; exit 1 ;;
        esac
        if [ "$RELEASE_TAG" = "ios-latest" ] || ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
          echo "::error::\"$RELEASE_TAG\" can't be a release tag."
          exit 1
        fi
        # A tag already there must be on this commit, or the release's IPA and
        # its tag's source would differ (publishing doesn't move a tag).
        REFS=$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
        TAGGED=$(echo "$REFS" | tail -n 1 | cut -f 1)
        if [ -n "$TAGGED" ] && [ "$TAGGED" != "$GITHUB_SHA" ]; then
          echo "::error::Tag $RELEASE_TAG is already on commit $TAGGED, not on $GITHUB_SHA (the commit this run builds). Pick a new tag."
          exit 1
        fi
        if ! grep -qxF "### What's in ${RELEASE_TAG}" "$RELEASE_NOTES"; then
          echo "::error file=$RELEASE_NOTES::No \"### What's in ${RELEASE_TAG}\" heading line. Update the release notes for ${RELEASE_TAG}, commit and push them, then run this again."
          exit 1
        fi

    - name: Cache SDL2.framework
      id: sdl-cache
      uses: actions/cache@v4
      with:
        path: sdl-ios/SDL2.framework
        key: sdl2-ios-${{ env.SDL_VERSION }}-macos-26

    - name: Build SDL2.framework
      if: steps.sdl-cache.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 https://github.com/libsdl-org/SDL -b "release-$SDL_VERSION" sdl-src
        cd sdl-src/Xcode/SDL
        xcodebuild -scheme xcFramework-iOS -target xcFramework-iOS build -configuration Release
        mkdir -p "$GITHUB_WORKSPACE/sdl-ios"
        cp -R Products/SDL2.xcframework/ios-arm64/SDL2.framework "$GITHUB_WORKSPACE/sdl-ios/"

    - name: Install SDL2.framework
      run: |
        sudo cp -R sdl-ios/SDL2.framework /Library/Frameworks/
        mkdir -p build && cp -R sdl-ios/SDL2.framework build/

    - name: Restore ANGLE
      uses: actions/cache/restore@v4
      with:
        path: angle-prebuilt
        key: ${{ needs.angle.outputs.key }}
        fail-on-cache-miss: true

    - name: Show ANGLE
      run: |
        for f in libEGL libGLESv2; do
          file "angle-prebuilt/out/ios/$f.framework/$f"
          otool -l "angle-prebuilt/out/ios/$f.framework/$f" | grep -A4 LC_BUILD_VERSION | grep -E 'platform|minos' || true
          otool -L "angle-prebuilt/out/ios/$f.framework/$f" | head -5
        done

    - name: Build IPA
      run: ANGLE_ROOT="$GITHUB_WORKSPACE/angle-prebuilt" bash scripts/ios/build_trilogy.sh

    # "Build <run> · <date>", the first line of the release text, with the
    # date the app was stamped with (scripts/ios/createipa.sh)
    - name: Build stamp
      run: |
        set -e
        DATE=$(python3 -I - "artifacts/$IPA_NAME" <<'PY'
        import plistlib, sys, zipfile
        z = zipfile.ZipFile(sys.argv[1])
        print(plistlib.loads(z.read("Payload/xash3d.app/Info.plist"))["SWBuildDate"])
        PY
        )
        echo "BUILD_STAMP=Build $GITHUB_RUN_NUMBER · $DATE" | tee -a "$GITHUB_ENV"

    - name: Check IPA contents
      run: |
        unzip -l "artifacts/$IPA_NAME" | grep -E '\.dylib$|/xash$'
        for f in libEGL libGLESv2; do
          # in Frameworks/: ANGLE's libEGL opens libGLESv2 from there
          unzip -l "artifacts/$IPA_NAME" | grep -q "xash3d.app/Frameworks/$f.framework/$f$" || { echo "missing ANGLE's Frameworks/$f.framework"; exit 1; }
        done
        unzip -l "artifacts/$IPA_NAME" | grep -q "xash3d.app/libref_gles3compat" || { echo "missing the gles3compat renderer"; exit 1; }
        for d in valve gearbox bshift; do
          unzip -l "artifacts/$IPA_NAME" | grep -q "xash3d.app/$d/dlls/" || { echo "missing $d server library"; exit 1; }
          unzip -l "artifacts/$IPA_NAME" | grep -q "xash3d.app/$d/cl_dlls/" || { echo "missing $d client library"; exit 1; }
        done

    # Before anything leaves the runner (the run artifact, ios-latest and the
    # release): the IPA must carry no game data, inside its .pk3 files too.
    - name: Check IPA has no game data
      run: python3 -I scripts/ios/check_no_game_data.py "artifacts/$IPA_NAME"

    - name: Upload IPA (artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Xash3D-iOS-unsigned-ipa
        path: artifacts/${{ env.IPA_NAME }}

    # Pushes to master and ordinary manual runs; a release run leaves ios-latest alone.
    - name: Publish ios-latest release
      if: github.ref == 'refs/heads/master' && env.RELEASE_TAG == ''
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete ios-latest --yes --cleanup-tag || true
        gh release create ios-latest "artifacts/$IPA_NAME" --prerelease \
          --title "iOS latest" --notes "$BUILD_STAMP
        Unsigned IPA from ${GITHUB_SHA::7}. Game data is not included."

    # Release runs: the tag created at the commit this run built, the notes
    # from that commit as the text, and a prerelease if the version has a '-'.
    - name: Publish release for the tag
      if: github.ref == 'refs/heads/master' && env.RELEASE_TAG != ''
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -e
        if ! grep -qxF "### What's in ${RELEASE_TAG}" "$RELEASE_NOTES"; then
          echo "::error file=$RELEASE_NOTES::No \"### What's in ${RELEASE_TAG}\" heading line."
          exit 1
        fi
        test -f "artifacts/$IPA_NAME" || { echo "::error::artifacts/$IPA_NAME wasn't built."; exit 1; }
        VERSION=${RELEASE_TAG#ios-}
        case "$VERSION" in
          *-*) KIND="--prerelease --latest=false" ;;
          *) KIND="--prerelease=false --latest" ;;
        esac
        TITLE="$RELEASE_TITLE $VERSION"
        { echo "$BUILD_STAMP"; echo; cat "$RELEASE_NOTES"; } > "$RUNNER_TEMP/release-notes.md"
        echo "Release \"$TITLE\" ($KIND) at $GITHUB_SHA"
        if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
          # the same tag on the same commit (checked before the build): update it
          gh release edit "$RELEASE_TAG" --title "$TITLE" --notes-file "$RUNNER_TEMP/release-notes.md" $KIND
          gh release upload "$RELEASE_TAG" "artifacts/$IPA_NAME" --clobber
        else
          gh release create "$RELEASE_TAG" "artifacts/$IPA_NAME" --target "$GITHUB_SHA" \
            --title "$TITLE" --notes-file "$RUNNER_TEMP/release-notes.md" $KIND
        fi
